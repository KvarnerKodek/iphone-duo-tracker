name: Refresh and publish stock page

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch availability
        id: fetch
        continue-on-error: true
        env:
          AVAILABILITY_URL: ${{ vars.AVAILABILITY_URL }}
        run: python3 -m scripts.fetch_availability
      - name: Build site
        if: steps.fetch.outcome == 'success'
        run: python3 -m scripts.build_site
      - uses: actions/configure-pages@v5
        if: steps.fetch.outcome == 'success'
      - uses: actions/upload-pages-artifact@v3
        if: steps.fetch.outcome == 'success'
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.fetch.outcome == 'success'
        uses: actions/deploy-pages@v4
